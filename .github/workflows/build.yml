name: Build APK
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Engine tests
        run: ./gradlew :engine:test
      - name: Restore release keystore (optional)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p keys
          echo "$KEYSTORE_BASE64" | base64 -d > keys/keystone-release.jks
          printf "storeFile=keys/keystone-release.jks\nstorePassword=%s\nkeyAlias=keystone\nkeyPassword=%s\n" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keys/keystore.properties
      - name: Build release APK
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: keystone-apk
          path: app/build/outputs/apk/release/*.apk
